changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 修复
      labels:
        - bug
        - fix
    - title: 维护与依赖
      labels:
        - dependencies
        - maintenance
        - chore
    - title: 其他变更
      labels:
        - "*"
